<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>安装知乎暗色网格脚本</title>
  <style>
    body {
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      max-width: 720px;
      margin: 48px auto;
      padding: 0 20px;
      line-height: 1.6;
      color: #1a1f2c;
    }
    a.btn {
      display: inline-block;
      margin: 8px 8px 8px 0;
      padding: 12px 18px;
      background: #2f6bff;
      color: #fff;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 600;
    }
    a.secondary {
      background: #121826;
    }
    code { background: #f3f4f6; padding: 2px 6px; border-radius: 4px; }
    .box {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 16px;
      background: #fafafa;
    }
  </style>
</head>
<body>
  <h1>知乎暗色网格 · 暴力猴安装</h1>
  <p>已检测到你使用暴力猴。请按下面按钮安装：</p>
  <p>
    <a class="btn" href="./zhihu-dark-grid.user.js">一键安装用户脚本</a>
    <a class="btn secondary" href="https://www.zhihu.com/" target="_blank" rel="noreferrer">安装后打开知乎</a>
  </p>
  <div class="box">
    <p><strong>若没有弹出安装页：</strong></p>
    <ol>
      <li>点击暴力猴图标 →「管理脚本」→「+」新建</li>
      <li>清空编辑器，粘贴 <code>zhihu-dark-grid.user.js</code> 全文</li>
      <li>保存后刷新知乎首页</li>
    </ol>
  </div>
</body>
</html>
